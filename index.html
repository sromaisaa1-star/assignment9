<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactHub | Smart Contact Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="container-fluid px-4 px-lg-5">
        <a href="#" class="brand">
            <span class="brand-icon"><i class="fa-solid fa-address-book"></i></span>
            <span>
                <strong>Contact<span>Hub</span></strong>
                <small>Smart Contact Manager</small>
            </span>
        </a>

        <div class="header-actions">
            <button class="btn-add" id="addContactBtn">
                <i class="fa-solid fa-plus"></i> Add Contact
            </button>
            <button class="icon-btn" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button class="icon-btn" aria-label="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
            <div class="profile">
    <img src="images/profile.jpg" alt="Profile">
</div>
         


    </div>
</header>

<main class="container-fluid px-4 px-lg-5 py-4">

    <section class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon blue"><i class="fa-solid fa-users"></i></div>
            <div><small>TOTAL</small><h3 id="totalCount">0</h3></div>
        </div>

        <div class="stat-card">
            <div class="stat-icon orange"><i class="fa-solid fa-star"></i></div>
            <div><small>FAVORITES</small><h3 id="favoritesCount">0</h3></div>
        </div>

        <div class="stat-card">
            <div class="stat-icon red"><i class="fa-solid fa-heart-pulse"></i></div>
            <div><small>EMERGENCY</small><h3 id="emergencyCount">0</h3></div>
        </div>
    </section>

    <section class="content-grid">
        <div class="contacts-section">
            <div class="section-heading">
                <h2 id="sectionTitle">All Contacts</h2>
                <p id="sectionSubtitle">Manage and organize your 0 contacts</p>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="searchInput"
                    placeholder="Search by name, phone, or email...">
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All Contacts</button>
                <button class="filter-btn" data-filter="favorites">Favorites</button>
                <button class="filter-btn" data-filter="emergency">Emergency</button>
            </div>

            <div id="contactsContainer" class="contacts-grid"></div>
        </div>

        <aside class="side-panels">
            <section class="side-card favorites-panel">
                <div class="side-heading">
                    <div class="stat-icon orange"><i class="fa-solid fa-star"></i></div>
                    <div><h5>Favorites</h5><small>Quick access to starred contacts</small></div>
                </div>
                <div id="favoritesList" class="side-content">
                    <p>No favorites yet</p>
                </div>
            </section>

            <section class="side-card emergency-panel">
                <div class="side-heading">
                    <div class="stat-icon red"><i class="fa-solid fa-heart-pulse"></i></div>
                    <div><h5>Emergency</h5><small>Important contacts for urgent calls</small></div>
                </div>
                <div id="emergencyList" class="side-content">
                    <p>No emergency contacts</p>
                </div>
            </section>
        </aside>
    </section>
</main>

<!-- Add / Edit Contact Modal -->
<div class="modal-overlay" id="contactModal">
    <div class="contact-modal">
        <div class="modal-header">
            <h2 id="modalTitle">Add New Contact</h2>
            <button type="button" id="closeModal" class="close-btn" aria-label="Close">&times;</button>
        </div>

        <form id="contactForm">
            <div class="photo-section">
                <div class="avatar-preview" id="avatarPreview">
                    <i class="fa-solid fa-user"></i>
                </div>
                <label class="photo-btn">
                    <i class="fa-solid fa-camera"></i> Change Photo
                    <input type="file" id="photoInput" accept="image/*" hidden>
                </label>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name <span>*</span></label>
                <input type="text" id="fullName" placeholder="Enter full name" required minlength="2" maxlength="60">
                <small class="field-error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number <span>*</span></label>
                <input type="tel" id="phone" placeholder="e.g., 01012345678" required>
                <small class="field-error" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
                <small class="field-error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Enter address">
            </div>

            <div class="form-group">
                <label for="group">Group</label>
                <select id="group">
                    <option value="">Select group</option>
                    <option value="Family">Family</option>
                    <option value="Friends">Friends</option>
                    <option value="Work">Work</option>
                    <option value="School">School</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" rows="3" placeholder="Add notes..."></textarea>
            </div>

            <div class="check-options">
                <label><input type="checkbox" id="favorite"> <i class="fa-solid fa-star"></i> Add to Favorites</label>
                <label><input type="checkbox" id="emergency"> <i class="fa-solid fa-heart-pulse"></i> Emergency Contact</label>
            </div>

            <div class="modal-actions">
                <button type="button" id="cancelModal" class="btn-cancel">Cancel</button>
                <button type="submit" class="btn-save" id="saveBtn">
                    <i class="fa-solid fa-check"></i> Save Contact
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>
